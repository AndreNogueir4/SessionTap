name: 💡 Feature request
description: Suggest an idea.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Would it store, show or send credentials somewhere new? Need new extension permissions?
