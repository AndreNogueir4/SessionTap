name: 🐛 Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste cookies, tokens, HAR files or captured requests here.** Redact them first.
        Security problems go to the private report form instead (see the issue chooser).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. sessiontap start\n2. Enable capture for example.com in the popup\n3. …"
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "sessiontap 1.0.0 · extension 1.0.0 · Brave 1.80 · Ubuntu 24.04"
    validations: { required: true }
  - type: textarea
    id: status
    attributes:
      label: Output of `sessiontap status`
      render: text
